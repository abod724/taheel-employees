<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>لغة عين - عربية خالصة مع دوال</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f0f0f0; direction: rtl; }
    textarea { width: 100%; height: 200px; font-family: monospace; font-size: 16px; }
    #الناتج { white-space: pre; background: #fff; padding: 10px; margin-top: 10px; border: 1px solid #ccc; font-family: monospace; min-height: 50px; }
    button { padding: 10px 20px; margin-top: 10px; font-size: 16px; margin-left: 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>
  <h1>مترجم لغة عين (عربية خالصة - مع دوال)</h1>
  <p>اكتب كود بلغة عين (استخدم الأرقام العربية ٠-٩):</p>
  <textarea id="كود_عين">// تعريف دالة
دالة جمع(أ، ب) {
  إرجع أ + ب
}

متغير الناتج = جمع(٥، ٣)
اطبع "نتيجة الجمع هي: " + الناتج

إذا (الناتج > ٧) {
  اطبع "الناتج كبير"
} آخر {
  اطبع "الناتج صغير"
}

كرر من ١ إلى ٢ {
  اطبع "تكرار"
}</textarea><br>
  <button onclick="شغل()">تشغيل</button>
  <button onclick="احفظ()">حفظ الكود</button>
  <button onclick="انسخ()">نسخ الناتج</button>

  <h2>الناتج:</h2>
  <div id="الناتج"></div>

  <script>
    // ==========================================
    // 0. دوال مساعدة (تحويل الأرقام)
    // ==========================================
    function تحويل_الأرقام_للإنجليزية(نص) {
      const خريطة = { '٠': '0', '١': '1', '٢': '2', '٣': '3', '٤': '4', '٥': '5', '٦': '6', '٧': '7', '٨': '8', '٩': '9' };
      return نص.replace(/[٠-٩]/g, (حرف) => خريطة[حرف]);
    }

    function تحويل_الأرقام_للعربية(نص) {
      const خريطة = { '0': '٠', '1': '١', '2': '٢', '3': '٣', '4': '٤', '5': '٥', '6': '٦', '7': '٧', '8': '٨', '9': '٩' };
      return String(نص).replace(/[0-9]/g, (رقم) => خريطة[رقم]);
    }

    // ==========================================
    // 1. المحلل المعجمي (Lexer)
    // ==========================================
    function tokenize(code) {
      code = تحويل_الأرقام_للإنجليزية(code);
      const tokens = [];
      // أضفنا دالة، إرجع، الفاصلة العربية ، والفاصلة الإنجليزية ,
      const regex = /\s*(متغير|اطبع|إذا|آخر|كرر|من|إلى|دالة|إرجع|[a-zA-Z\u0600-\u06FF_][a-zA-Z0-9\u0600-\u06FF_]*|\d+|"[^"]*"|'[^']*'|[=><+\-*/{}()،,])/g;
      let match;
      while ((match = regex.exec(code)) !== null) {
        let value = match[1];
        let type = 'معرف';
        
        if (['متغير', 'اطبع', 'إذا', 'آخر', 'كرر', 'من', 'إلى', 'دالة', 'إرجع'].includes(value)) {
          type = 'كلمة_محجوزة';
        } else if (/^\d+$/.test(value)) {
          type = 'رقم';
        } else if (/^["'].*["']$/.test(value)) {
          type = 'نص';
          value = value.slice(1, -1);
        } else if (['=', '>', '<', '+', '-', '*', '/', '{', '}', '(', ')', '،', ','].includes(value)) {
          type = 'رمز';
        }
        tokens.push({ type, value });
      }
      return tokens;
    }

    // ==========================================
    // 2. المحلل النحوي (Parser)
    // ==========================================
    function parse(tokens) {
      let pos = 0;
      function peek() { return tokens[pos]; }
      function consume() { return tokens[pos++]; }

      function parseProgram() {
        const statements = [];
        while (pos < tokens.length) {
          statements.push(parseStatement());
        }
        return { type: 'برنامج', body: statements };
      }

      function parseStatement() {
        const token = peek();
        if (!token) return null;

        if (token.type === 'كلمة_محجوزة') {
          if (token.value === 'متغير') {
            consume();
            const name = consume().value;
            consume(); // =
            const value = parseExpression();
            return { type: 'إعلان_متغير', name, value };
          }
          if (token.value === 'اطبع') {
            consume();
            const value = parseExpression();
            return { type: 'جملة_طباعة', value };
          }
          if (token.value === 'إذا') {
            consume(); consume(); // (
            const condition = parseExpression();
            consume(); // )
            const consequent = parseBlock();
            let alternate = null;
            if (peek() && peek().value === 'آخر') {
              consume();
              alternate = parseBlock();
            }
            return { type: 'جملة_شرطية', condition, consequent, alternate };
          }
          if (token.value === 'كرر') {
            consume(); consume(); // من
            const start = parseExpression();
            consume(); // إلى
            const end = parseExpression();
            const body = parseBlock();
            return { type: 'جملة_تكرار', start, end, body };
          }
          if (token.value === 'دالة') {
            consume();
            const name = consume().value;
            consume(); // (
            const params = [];
            while (peek() && peek().value !== ')') {
              if (peek().value === '،' || peek().value === ',') { consume(); continue; }
              params.push(consume().value);
            }
            consume(); // )
            const body = parseBlock();
            return { type: 'دالة', name, params, body };
          }
          if (token.value === 'إرجع') {
            consume();
            const value = parseExpression();
            return { type: 'إرجع', value };
          }
        }
        return parseExpression();
      }

      function parseBlock() {
        consume(); // {
        const body = [];
        while (peek() && peek().value !== '}') {
          body.push(parseStatement());
        }
        consume(); // }
        return { type: 'كتلة', body };
      }

      function parseExpression() {
        let left = parsePrimary();
        while (peek() && ['>', '<', '+', '-', '*', '/'].includes(peek().value)) {
          const op = consume().value;
          const right = parsePrimary();
          left = { type: 'تعبير_ثنائي', operator: op, left, right };
        }
        return left;
      }

      function parsePrimary() {
        const token = consume();
        if (token.type === 'رقم') return { type: 'رقم', value: parseInt(token.value) };
        if (token.type === 'نص') return { type: 'نص', value: token.value };
        
        if (token.type === 'معرف') {
          // التحقق مما إذا كان استدعاء دالة
          if (peek() && peek().value === '(') {
            consume(); // (
            const args = [];
            while (peek() && peek().value !== ')') {
              if (peek().value === '،' || peek().value === ',') { consume(); continue; }
              args.push(parseExpression());
            }
            consume(); // )
            return { type: 'استدعاء_دالة', name: token.value, args };
          }
          return { type: 'معرف', name: token.value };
        }
        throw new Error(`خطأ في التحليل: ${token.value}`);
      }

      return parseProgram();
    }

    // ==========================================
    // 3. المفسر (Interpreter) - مع دعم النطاقات
    // ==========================================
    class البيئة {
      constructor(الأب = null) {
        this.القيم = {};
        this.الأب = الأب;
      }
      تعريف(اسم, قيمة) { this.القيم[اسم] = قيمة; }
      جلب(اسم) {
        if (Object.prototype.hasOwnProperty.call(this.القيم, اسم)) return this.القيم[اسم];
        if (this.الأب) return this.الأب.جلب(اسم);
        throw new Error(`متغير غير معرف: ${اسم}`);
      }
    }

    function evaluate(ast, env, onOutput) {
      function evalNode(node, currentEnv) {
        if (!node) return;
        switch (node.type) {
          case 'برنامج':
            node.body.forEach(child => evalNode(child, currentEnv));
            break;
          case 'إعلان_متغير':
            currentEnv.تعريف(node.name, evalNode(node.value, currentEnv));
            break;
          case 'جملة_طباعة':
            onOutput(evalNode(node.value, currentEnv));
            break;
          case 'جملة_شرطية':
            if (evalNode(node.condition, currentEnv)) {
              evalNode(node.consequent, currentEnv);
            } else if (node.alternate) {
              evalNode(node.alternate, currentEnv);
            }
            break;
          case 'جملة_تكرار':
            const start = evalNode(node.start, currentEnv);
            const end = evalNode(node.end, currentEnv);
            for (let i = start; i <= end; i++) {
              currentEnv.تعريف('i', i);
              evalNode(node.body, currentEnv);
            }
            break;
          case 'كتلة':
            node.body.forEach(child => evalNode(child, currentEnv));
            break;
          case 'دالة':
            currentEnv.تعريف(node.name, { type: 'دالة', params: node.params, body: node.body, env: currentEnv });
            break;
          case 'استدعاء_دالة':
            const func = currentEnv.جلب(node.name);
            if (func.type !== 'دالة') throw new Error(`${node.name} ليست دالة`);
            const args = node.args.map(arg => evalNode(arg, currentEnv));
            const funcEnv = new البيئة(func.env); // نطاق جديد للدالة
            func.params.forEach((param, index) => {
              funcEnv.تعريف(param, args[index] !== undefined ? args[index] : null);
            });
            try {
              evalNode(func.body, funcEnv);
            } catch (e) {
              if (e.type === 'إرجع') return e.value;
              throw e;
            }
            return null; // الدوال التي لا ترجع قيمة
          case 'إرجع':
            throw { type: 'إرجع', value: evalNode(node.value, currentEnv) };
          case 'تعبير_ثنائي':
            const left = evalNode(node.left, currentEnv);
            const right = evalNode(node.right, currentEnv);
            switch (node.operator) {
              case '>': return left > right;
              case '<': return left < right;
              case '+': return left + right;
              case '-': return left - right;
              case '*': return left * right;
              case '/': return left / right;
            }
            break;
          case 'رقم': return node.value;
          case 'نص': return node.value;
          case 'معرف': return currentEnv.جلب(node.name);
        }
      }
      evalNode(ast, env);
    }

    // ==========================================
    // واجهة المستخدم
    // ==========================================
    function شغل() {
      const code = document.getElementById("كود_عين").value;
      const outputDiv = document.getElementById("الناتج");
      outputDiv.innerText = ""; 
      
      try {
        const tokens = tokenize(code);
        const ast = parse(tokens);
        const env = new البيئة();
        evaluate(ast, env, (msg) => {
          // تحويل الأرقام في الناتج إلى عربية
          outputDiv.innerText += تحويل_الأرقام_للعربية(msg) + "\n";
        });
      } catch (error) {
        outputDiv.innerText = "❌ خطأ: " + error.message;
      }
    }

    function احفظ() {
      const كود = document.getElementById("كود_عين").value;
      const ملف = new Blob([كود], { type: "text/plain" });
      const رابط = document.createElement("a");
      رابط.href = URL.createObjectURL(ملف);
      رابط.download = "الكود.ain";
      رابط.click();
    }

    function انسخ() {
      const نص = document.getElementById("الناتج").innerText;
      navigator.clipboard.writeText(نص).then(() => {
        alert("تم نسخ الناتج!");
      });
    }
  </script>
</body>
</html>
