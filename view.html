<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>استبيان ورشة الصرع - مركز التأهيل الشامل</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e0f0ff, #f5faff);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      max-width: 750px;
      width: 100%;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(6px);
      border-radius: 40px;
      padding: 40px 30px;
      box-shadow: 0 20px 40px rgba(0, 20, 40, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    h1 {
      font-size: 2rem;
      color: #0a2647;
      margin-bottom: 6px;
    }
    .sub {
      color: #2d4d6e;
      font-size: 1rem;
      border-right: 4px solid #2b7a8a;
      padding-right: 16px;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-weight: 600;
      color: #0a2647;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }
    label .required {
      color: #c00;
      margin-right: 4px;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #d6e6f5;
      border-radius: 16px;
      font-size: 1rem;
      background: #fff;
      transition: 0.2s;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #1a5a8a;
      outline: none;
      box-shadow: 0 0 0 4px rgba(26, 90, 138, 0.1);
    }
    textarea {
      resize: vertical;
      min-height: 80px;
    }
    .radio-group, .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      background: #f0f8ff;
      padding: 16px 20px;
      border-radius: 20px;
      border: 1px solid #d6e6f5;
    }
    .radio-group label, .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 400;
      font-size: 0.95rem;
      color: #1d3b57;
      cursor: pointer;
    }
    .radio-group input, .checkbox-group input {
      width: auto;
      accent-color: #0a2647;
      transform: scale(1.1);
    }
    .stars {
      display: flex;
      flex-direction: row-reverse;
      justify-content: flex-end;
      gap: 8px;
    }
    .stars input {
      display: none;
    }
    .stars label {
      font-size: 2rem;
      color: #ccc;
      cursor: pointer;
      transition: 0.2s;
    }
    .stars label:hover,
    .stars label:hover ~ label,
    .stars input:checked ~ label {
      color: #f5b342;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 25px;
    }
    .btn {
      background: #0a2647;
      color: #fff;
      border: none;
      padding: 14px 34px;
      border-radius: 60px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: 0.2s;
      box-shadow: 0 4px 12px rgba(10, 38, 71, 0.2);
      flex: 1 1 auto;
      justify-content: center;
      border: 2px solid transparent;
    }
    .btn:hover {
      background: #1d4a75;
      transform: scale(1.02);
    }
    .btn-outline {
      background: transparent;
      color: #0a2647;
      border: 2px solid #0a2647;
      box-shadow: none;
    }
    .btn-outline:hover {
      background: #0a2647;
      color: #fff;
    }
    .footer-note {
      margin-top: 30px;
      font-size: 0.85rem;
      color: #3c5d7a;
      text-align: center;
      border-top: 1px solid #cbdae9;
      padding-top: 20px;
    }
    .credit {
      margin-top: 10px;
      font-weight: 600;
      color: #0a2647;
      background: #e6f0fa;
      padding: 10px 16px;
      border-radius: 50px;
      display: inline-block;
      font-size: 0.9rem;
    }
    .credit span {
      color: #1d5a7a;
    }

    /* --- نافذة "شكراً لمشاركتك" المنبثقة --- */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .modal-box {
      background: #fff;
      padding: 40px 50px;
      border-radius: 40px;
      text-align: center;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 30px 60px rgba(0,0,0,0.3);
      animation: popIn 0.3s ease-out;
    }
    .modal-box .icon {
      font-size: 4rem;
      margin-bottom: 10px;
    }
    .modal-box h2 {
      color: #0a2647;
      margin-bottom: 10px;
      font-size: 1.8rem;
    }
    .modal-box p {
      color: #3c5d7a;
      margin-bottom: 25px;
      font-size: 1rem;
    }
    .modal-box .btn-close-modal {
      background: #0a2647;
      color: #fff;
      border: none;
      padding: 12px 40px;
      border-radius: 60px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .modal-box .btn-close-modal:hover {
      background: #1d4a75;
      transform: scale(1.03);
    }
    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 600px) {
      .radio-group, .checkbox-group {
        flex-direction: column;
        gap: 8px;
      }
      .stars label {
        font-size: 1.6rem;
      }
      h1 {
        font-size: 1.6rem;
      }
      .modal-box {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <!-- نموذج الاستبيان -->
  <div class="card">
    <h1>📝 استبيان تقييم الورشة</h1>
    <div class="sub">
      الصرع وطرق التعامل معه – <strong>مركز التأهيل الشامل بحفر الباطن</strong>
    </div>

    <form id="surveyForm" onsubmit="return submitSurvey(event)">
      <!-- 1. الاسم -->
      <div class="form-group">
        <label>الاسم (اختياري)</label>
        <input type="text" id="name" placeholder="أدخل اسمك" />
      </div>

      <!-- 2. التخصص / القسم -->
      <div class="form-group">
        <label>التخصص / القسم <span class="required">*</span></label>
        <input type="text" id="department" required placeholder="مثال: تمريض، علاج طبيعي..." />
      </div>

      <!-- 3. تقييم المحتوى العلمي (نجوم) -->
      <div class="form-group">
        <label>مدى فائدة المحتوى العلمي للورشة <span class="required">*</span></label>
        <div class="stars" id="ratingStars">
          <input type="radio" name="rating" value="5" id="star5" />
          <label for="star5">★</label>
          <input type="radio" name="rating" value="4" id="star4" />
          <label for="star4">★</label>
          <input type="radio" name="rating" value="3" id="star3" />
          <label for="star3">★</label>
          <input type="radio" name="rating" value="2" id="star2" />
          <label for="star2">★</label>
          <input type="radio" name="rating" value="1" id="star1" />
          <label for="star1">★</label>
        </div>
      </div>

      <!-- 4. تقييم المدرب -->
      <div class="form-group">
        <label>تقييمك لأداء الأخصائي / عبيد رحيم الشمري <span class="required">*</span></label>
        <select id="trainerEval" required>
          <option value="">-- اختر التقييم --</option>
          <option value="ممتاز">⭐ ممتاز</option>
          <option value="جيد جداً">👍 جيد جداً</option>
          <option value="جيد">👌 جيد</option>
          <option value="مقبول">😐 مقبول</option>
          <option value="ضعيف">👎 ضعيف</option>
        </select>
      </div>

      <!-- 5. تغير النظرة عن الصرع -->
      <div class="form-group">
        <label>هل تغيرت نظرتك عن الصرع بعد حضور الورشة؟ <span class="required">*</span></label>
        <div class="radio-group">
          <label><input type="radio" name="perspective" value="نعم، بشكل كبير" required /> نعم، بشكل كبير</label>
          <label><input type="radio" name="perspective" value="نعم، قليلاً" /> نعم، قليلاً</label>
          <label><input type="radio" name="perspective" value="لا، لم تتغير" /> لا، لم تتغير</label>
        </div>
      </div>

      <!-- 6. ممارسات التعامل مع النوبات -->
      <div class="form-group">
        <label>هل تشعر الآن بقدرة أفضل على التعامل مع نوبات الصرع؟ <span class="required">*</span></label>
        <div class="radio-group">
          <label><input type="radio" name="confidence" value="نعم، بثقة عالية" required /> نعم، بثقة عالية</label>
          <label><input type="radio" name="confidence" value="إلى حد ما" /> إلى حد ما</label>
          <label><input type="radio" name="confidence" value="لا زلت بحاجة لتطبيق عملي" /> لا زلت بحاجة لتطبيق عملي</label>
        </div>
      </div>

      <!-- 7. الرضا العام (جديد) -->
      <div class="form-group">
        <label>ما هو تقييمك العام للورشة؟ <span class="required">*</span></label>
        <div class="radio-group">
          <label><input type="radio" name="generalSatisfaction" value="راضي" required /> 😊 راضي</label>
          <label><input type="radio" name="generalSatisfaction" value="محايد" /> 😐 محايد</label>
          <label><input type="radio" name="generalSatisfaction" value="غير راضي" /> 😞 غير راضي</label>
        </div>
      </div>

      <!-- 8. اقتراحات -->
      <div class="form-group">
        <label>اقتراحاتك لتطوير الورشة أو مواضيع مقترحة مستقبلاً</label>
        <textarea id="suggestions" placeholder="اكتب اقتراحاتك هنا..."></textarea>
      </div>

      <!-- أزرار -->
      <div class="btn-group">
        <button type="submit" class="btn">📧 إرسال الاستبيان</button>
        <button type="reset" class="btn btn-outline">🗑️ تفريغ الحقول</button>
      </div>
    </form>

    <div class="footer-note">
      <!-- لا توجد أي عبارة عن الإرسال أو البريد -->
      <div class="credit">
        🖥️ برمجة وتصميم: <span>عبدالله حسين المطيري</span> | <span>بدر فريح الحربي</span>
      </div>
      <br />
      <span style="font-size:0.8rem;">© 2026 – مركز التأهيل الشامل بحفر الباطن – قسم التمريض</span>
    </div>
  </div>

  <!-- نافذة "شكراً لمشاركتك" المنبثقة (مخفية ابتداءً) -->
  <div class="modal-overlay" id="thankYouModal">
    <div class="modal-box">
      <div class="icon">🙏</div>
      <h2>شكراً لمشاركتك</h2>
      <p>تم استلام آرائك بنجاح، وهي تهمنا في تطوير أعمالنا.</p>
      <button class="btn-close-modal" onclick="closeModal()">حسناً</button>
    </div>
  </div>

  <script>
    function closeModal() {
      document.getElementById('thankYouModal').style.display = 'none';
    }

    function submitSurvey(e) {
      e.preventDefault();

      // جمع البيانات
      const name = document.getElementById('name').value || 'لم يذكر';
      const dept = document.getElementById('department').value.trim();
      const rating = document.querySelector('input[name="rating"]:checked');
      const trainer = document.getElementById('trainerEval').value;
      const perspective = document.querySelector('input[name="perspective"]:checked');
      const confidence = document.querySelector('input[name="confidence"]:checked');
      const generalSat = document.querySelector('input[name="generalSatisfaction"]:checked');
      const suggestions = document.getElementById('suggestions').value || 'لا يوجد';

      // التحقق من الحقول الإجبارية
      if (!dept || !rating || !trainer || !perspective || !confidence || !generalSat) {
        alert('⚠️ الرجاء تعبئة جميع الحقول الإجبارية (التي تحمل علامة *)');
        return false;
      }

      // بناء نص البريد
      const body = 
        `📋 *نتائج استبيان ورشة الصرع* 📋\n` +
        `------------------------------------\n` +
        `🏢 المركز: مركز التأهيل الشامل بحفر الباطن\n` +
        `👤 الاسم: ${name}\n` +
        `🏥 القسم: ${dept}\n` +
        `⭐ تقييم المحتوى: ${rating.value} من 5 نجوم\n` +
        `🎤 تقييم المدرب (عبيد الشمري): ${trainer}\n` +
        `🧠 تغير النظرة عن الصرع: ${perspective.value}\n` +
        `🛡️ الثقة بالتعامل مع النوبات: ${confidence.value}\n` +
        `📊 الرضا العام عن الورشة: ${generalSat.value}\n` +
        `💡 الاقتراحات: ${suggestions}\n` +
        `------------------------------------\n` +
        `تم الإرسال بواسطة: ${name} (${dept})`;

      // فتح البريد الإلكتروني (يحدث في الخلفية)
      window.location.href = `mailto:al3ofi1403@gmail.com?subject=📊 نتيجة استبيان ورشة الصرع - ${dept}&body=${encodeURIComponent(body)}`;

      // إظهار نافذة "شكراً لمشاركتك" بدلاً من التنبيه القديم
      document.getElementById('thankYouModal').style.display = 'flex';

      // (اختياري) إعادة تعيين النموذج بعد الإرسال
      document.getElementById('surveyForm').reset();

      return false;
    }
  </script>
</body>
</html>
