<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>استبيان ورشة الصرع</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #eef7ff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      max-width: 700px;
      width: 100%;
      background: #fff;
      border-radius: 30px;
      padding: 30px 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    h1 { font-size: 1.8rem; color: #0a2647; margin-bottom: 4px; }
    .sub { color: #2d4d6e; font-size: 1rem; border-right: 4px solid #2b7a8a; padding-right: 14px; margin-bottom: 25px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; color: #0a2647; margin-bottom: 6px; font-size: 0.95rem; }
    label .required { color: #c00; }
    input, select, textarea {
      width: 100%; padding: 12px 16px;
      border: 2px solid #d6e6f5; border-radius: 16px;
      font-size: 1rem; background: #fff;
      transition: 0.2s; font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #1a5a8a;
      outline: none;
      box-shadow: 0 0 0 4px rgba(26,90,138,0.08);
    }
    textarea { min-height: 70px; resize: vertical; }
    .radio-group {
      display: flex; flex-wrap: wrap; gap: 16px;
      background: #f5faff; padding: 12px 16px;
      border-radius: 18px; border: 1px solid #d6e6f5;
    }
    .radio-group label {
      display: flex; align-items: center; gap: 6px;
      font-weight: 400; font-size: 0.95rem;
      color: #1d3b57; cursor: pointer;
    }
    .radio-group input { width: auto; accent-color: #0a2647; transform: scale(1.1); }
    .stars {
      display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 6px;
    }
    .stars input { display: none; }
    .stars label {
      font-size: 2.2rem; color: #ccc; cursor: pointer; transition: 0.2s;
    }
    .stars label:hover,
    .stars label:hover ~ label,
    .stars input:checked ~ label {
      color: #f5b342;
    }
    .btn-group { display: flex; gap: 12px; margin-top: 25px; flex-wrap: wrap; }
    .btn {
      background: #0a2647; color: #fff; border: none;
      padding: 14px 30px; border-radius: 60px;
      font-size: 1rem; font-weight: 600; cursor: pointer;
      flex: 1; text-align: center;
      transition: 0.2s; box-shadow: 0 4px 12px rgba(10,38,71,0.15);
    }
    .btn:hover { background: #1d4a75; transform: scale(1.02); }
    .btn-outline { background: transparent; color: #0a2647; border: 2px solid #0a2647; box-shadow: none; }
    .btn-outline:hover { background: #0a2647; color: #fff; }

    .footer-note {
      margin-top: 25px;
      font-size: 0.8rem;
      color: #4d6a85;
      text-align: center;
      border-top: 1px solid #d6e6f5;
      padding-top: 18px;
    }
    .credit {
      font-weight: 600;
      color: #0a2647;
      background: #e6f0fa;
      padding: 6px 14px;
      border-radius: 40px;
      display: inline-block;
      font-size: 0.85rem;
    }
    .modal-overlay {
      display: none; position: fixed; top:0;left:0;width:100%;height:100%;
      background: rgba(0,0,0,0.4); backdrop-filter: blur(3px);
      justify-content: center; align-items: center; z-index: 999;
    }
    .modal-box {
      background: #fff; padding: 30px 25px; border-radius: 30px;
      text-align: center; max-width: 350px; width: 90%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
    }
    .modal-box .icon { font-size: 3.5rem; }
    .modal-box h2 { color: #0a2647; margin: 8px 0; font-size: 1.6rem; }
    .modal-box p { color: #3c5d7a; margin-bottom: 20px; font-size: 0.95rem; }
    .modal-box .btn-close-modal {
      background: #0a2647; color: #fff; border: none;
      padding: 10px 35px; border-radius: 60px;
      font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    .modal-box .btn-close-modal:hover { background: #1d4a75; }
    @media (max-width:500px) {
      h1 { font-size: 1.5rem; }
      .stars label { font-size: 1.8rem; }
      .radio-group { flex-direction: column; gap: 6px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📝 استبيان تقييم الورشة</h1>
    <div class="sub">
      الصرع وطرق التعامل معه – <strong>مركز التأهيل الشامل بحفر الباطن</strong>
    </div>

    <!-- النموذج يرسل مباشرة إلى Formspree (بريدك) -->
    <form id="surveyForm" action="https://formspree.io/f/xqpkgjoa" method="POST">
      <input type="text" name="_gotcha" style="display:none" />

      <div class="form-group">
        <label>الاسم (اختياري)</label>
        <input type="text" name="الاسم" placeholder="أدخل اسمك" />
      </div>
      <div class="form-group">
        <label>التخصص / القسم <span class="required">*</span></label>
        <input type="text" name="القسم" required placeholder="مثال: تمريض، علاج طبيعي..." />
      </div>
      <div class="form-group">
        <label>مدى فائدة المحتوى العلمي <span class="required">*</span></label>
        <div class="stars">
          <input type="radio" name="تقييم_المحتوى" value="5 نجوم" id="star5" required />
          <label for="star5">★</label>
          <input type="radio" name="تقييم_المحتوى" value="4 نجوم" id="star4" />
          <label for="star4">★</label>
          <input type="radio" name="تقييم_المحتوى" value="3 نجوم" id="star3" />
          <label for="star3">★</label>
          <input type="radio" name="تقييم_المحتوى" value="2 نجوم" id="star2" />
          <label for="star2">★</label>
          <input type="radio" name="تقييم_المحتوى" value="1 نجوم" id="star1" />
          <label for="star1">★</label>
        </div>
      </div>
      <div class="form-group">
        <label>تقييم المدرب <span class="required">*</span></label>
        <select name="تقييم_المدرب" required>
          <option value="">-- اختر --</option>
          <option value="ممتاز">⭐ ممتاز</option>
          <option value="جيد جداً">👍 جيد جداً</option>
          <option value="جيد">👌 جيد</option>
          <option value="مقبول">😐 مقبول</option>
          <option value="ضعيف">👎 ضعيف</option>
        </select>
      </div>
      <div class="form-group">
        <label>هل تغيرت نظرتك عن الصرع؟ <span class="required">*</span></label>
        <div class="radio-group">
          <label><input type="radio" name="تغير_النظرة" value="نعم، بشكل كبير" required /> نعم، بشكل كبير</label>
          <label><input type="radio" name="تغير_النظرة" value="نعم، قليلاً" /> نعم، قليلاً</label>
          <label><input type="radio" name="تغير_النظرة" value="لا" /> لا</label>
        </div>
      </div>
      <div class="form-group">
        <label>الثقة بالتعامل مع النوبات <span class="required">*</span></label>
        <div class="radio-group">
          <label><input type="radio" name="الثقة_بالتعامل" value="عالية" required /> نعم، بثقة عالية</label>
          <label><input type="radio" name="الثقة_بالتعامل" value="متوسطة" /> إلى حد ما</label>
          <label><input type="radio" name="الثقة_بالتعامل" value="منخفضة" /> لا زلت بحاجة لتطبيق</label>
        </div>
      </div>
      <div class="form-group">
        <label>الرضا العام عن الورشة <span class="required">*</span></label>
        <div class="radio-group">
          <label><input type="radio" name="الرضا_العام" value="راضي" required /> 😊 راضي</label>
          <label><input type="radio" name="الرضا_العام" value="محايد" /> 😐 محايد</label>
          <label><input type="radio" name="الرضا_العام" value="غير راضي" /> 😞 غير راضي</label>
        </div>
      </div>
      <div class="form-group">
        <label>اقتراحاتك</label>
        <textarea name="الاقتراحات" placeholder="اكتب اقتراحاتك..."></textarea>
      </div>

      <div class="btn-group">
        <button type="submit" class="btn">📧 إرسال</button>
        <button type="reset" class="btn btn-outline">🗑️ تفريغ</button>
      </div>
    </form>

    <div class="footer-note">
      <div class="credit">
        🖥️ برمجة وتصميم: <span>عبدالله حسين المطيري</span> | <span>بدر فريح الحربي</span>
      </div>
      <br />
      <span>© 2026 – مركز التأهيل الشامل بحفر الباطن – قسم التمريض</span>
    </div>
  </div>

  <!-- نافذة شكر -->
  <div class="modal-overlay" id="thankYouModal">
    <div class="modal-box">
      <div class="icon">🙏</div>
      <h2>شكراً لمشاركتك</h2>
      <p>تم استلام آرائك بنجاح، وهي تهمنا لتطوير أعمالنا.</p>
      <button class="btn-close-modal" onclick="closeModal()">حسناً</button>
    </div>
  </div>

  <script>
    document.getElementById('surveyForm').addEventListener('submit', function(e) {
      // نعرض نافذة الشكر بعد 1 ثانية
      setTimeout(() => {
        document.getElementById('thankYouModal').style.display = 'flex';
      }, 600);
    });

    function closeModal() {
      document.getElementById('thankYouModal').style.display = 'none';
    }
  </script>
</body>
</html>
