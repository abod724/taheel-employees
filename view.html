<script>
const خريطة_ع_إ = {'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
const خريطة_إ_ع = {'0':'٠','1':'١','2':'٢','3':'٣','4':'٤','5':'٥','6':'٦','7':'٧','8':'٨','9':'٩'};
const تحويل_الأرقام_للإنجليزية = function(ن) { return ن.replace(/[٠-٩]/g, function(ح) { return خريطة_ع_إ[ح]; }); };
const تحويل_الأرقام_للعربية = function(ن) { return String(ن).replace(/[0-9]/g, function(ر) { return خريطة_إ_ع[ر]; }); };

// 🎯 خريطة الكلمات الإنجليزية للعربية
var الإنجليزي_للعربي = {
  'print': 'اطبع',
  'console': 'اطبع',
  'log': 'اطبع',
  'if': 'إذا',
  'else': 'آخر',
  'for': 'كرر',
  'while': 'بينما',
  'do': 'كرر',
  'function': 'دالة',
  'def': 'دالة',
  'return': 'إرجع',
  'var': '(اكتب اسم المتغير مباشرة)',
  'let': '(اكتب اسم المتغير مباشرة)',
  'const': '(اكتب اسم المتغير مباشرة)',
  'true': 'صحيح',
  'false': 'خطأ',
  'null': 'فراغ',
  'break': '(غير مدعوم بعد)',
  'continue': '(غير مدعوم بعد)',
  'class': '(غير مدعوم بعد)',
  'import': '(غير مدعوم بعد)',
  'from': '(غير مدعوم بعد)',
  'switch': '(غير مدعوم بعد)',
  'case': '(غير مدعوم بعد)',
  'try': '(غير مدعوم بعد)',
  'catch': '(غير مدعوم بعد)'
};

function اقترح_حل(خطأ) {
  const رسالة = (خطأ && خطأ.message) ? خطأ.message : String(خطأ);

  // ⭐ فحص كلمات إنجليزية أولاً (قبل أي شي ثاني)
  for (var كلمة_إنج في الإنجليزي_للعربي) {
    const بديل = الإنجليزي_للعربي[كلمة_إنج];

    // لو الرسالة فيها الكلمة الإنجليزية
    if (رسالة.indexOf('"' + كلمة_إنج + '"') !== -1 ||
        رسالة.indexOf(': ' + كلمة_إنج) !== -1 ||
        رسالة.indexOf(kلمة_إنج + ' ') !== -1) {

      // نحضّر مثال صحيح
      var مثال = '';
      if (كلمة_إنج === 'print' || كلمة_إنج === 'console' || كلمة_إنج === 'log') {
        مثال = 'اطبع("مرحبا")   ← صح\n\nprint("مرحبا")   ← غلط';
      } else if (كلمة_إنج === 'if') {
        مثال = 'إذا (العمر >= ١٨) {\n  اطبع("بالغ")\n}\n\nif (age >= 18) { }   ← غلط';
      } else if (كلمة_إنج === 'else') {
        مثال = 'إذا (...) {\n} آخر {\n}\n\nelse { }   ← غلط';
      } else if (كلمة_إنج === 'for') {
        مثال = 'كرر ع من ١ إلى ٥ {\n  اطبع(ع)\n}\n\nfor (...) { }   ← غلط';
      } else if (كلمة_إنج === 'while') {
        مثال = 'بينما (س < ٥) {\n  س = س + ١\n}\n\nwhile (...) { }   ← غلط';
      } else if (كلمة_إنج === 'function' || كلمة_إنج === 'def') {
        مثال = 'دالة جمع(أ، ب) {\n  إرجع أ + ب\n}\n\nfunction add(a, b) { }   ← غلط';
      } else if (كلمة_إنج === 'return') {
        مثال = 'دالة جمع(أ، ب) {\n  إرجع أ + ب\n}\n\nreturn a + b;   ← غلط';
      } else if (كلمة_إنج === 'var' || كلمة_إنج === 'let' || كلمة_إنج === 'const') {
        مثال = 'الاسم = "أحمد"\n\nlet name = "Ahmed";   ← غلط';
      } else if (كلمة_إنج === 'true' || كلمة_إنج === 'false') {
        مثال = 'مسجل = صحيح\n\nregistered = true;   ← غلط';
      } else {
        مثال = 'استخدم "' + بديل + '" بدل "' + كلمة_إنج + '"';
      }

      return {
        العنوان: '💡 هذي كلمة إنجليزية: "' + كلمة_إنج + '"',
        الشرح: 'لغة عين تفهم العربي فقط. بدّل "' + كلمة_إنج + '" بـ "' + بديل + '"',
        المثال: مثال
      };
    }
  }

  // نسي قوس الإغلاق }
  if (رسالة.indexOf('متوقع "}"') !== -1) {
    const وردت = (رسالة.match(/وجدت "([^"]*)"/) || [])[1] || '؟';
    return {
      العنوان: 'نسيت قوس إغلاق البلوك',
      الشرح: 'كل بلوك يبدأ بـ { لازم ينتهي بـ }. المترجم وصل لكلمة "' + وردت + '" وهو لسا يدور على قوس الإغلاق.',
      المثال: 'كرر ع من ١ إلى ٥ {\n  اطبع(ع)\n}'
    };
  }

  // نسي قوس فتح (
  if (رسالة.indexOf('متوقع "("') !== -1) {
    return {
      العنوان: 'نسيت القوس (',
      الشرح: 'أوامر إذا وكرر والدوال لازم بعدها قوس فتح.',
      المثال: 'إذا (العمر >= ١٨) { }\nكرر ع من ١ إلى ٥ { }'
    };
  }

  // نسي قوس إغلاق )
  if (رسالة.indexOf('متوقع ")"') !== -1) {
    return {
      العنوان: 'نسيت قوس الإغلاق )',
      الشرح: 'كل قوس فتح ( لازم يقابله قوس إغلاق ).',
      المثال: 'إذا (العمر >= ١٨) { }'
    };
  }

  // نسي قوس فتح {
  if (رسالة.indexOf('متوقع "{"') !== -1) {
    return {
      العنوان: 'نسيت قوس فتح البلوك {',
      الشرح: 'بعد الشرط أو الحلقة، لازم تفتح بلوك بـ { عشان تكتب الكود داخله.',
      المثال: 'إذا (العمر >= ١٨) {\n  اطبع("بالغ")\n}'
    };
  }

  // نسي فاصلة في المصفوفة
  if (رسالة.indexOf('متوقع "]"') !== -1) {
    return {
      العنوان: 'نسيت فاصلة في المصفوفة',
      الشرح: 'المصفوفة لازم تكون بين [ ]، وبين كل عنصر وعنصر فاصلة (،) أو (,).',
      المثال: 'أرقام = [١، ٢، ٣، ٤]   ← صح\nأرقام = [١ ٢ ٣ ٤]    ← غلط'
    };
  }

  // متغير غير معرّف
  if (رسالة.indexOf('متغير غير معرّف:') !== -1) {
    const اسم = رسالة.split(':').pop().trim();
    return {
      العنوان: 'ما عرّفت المتغير "' + اسم + '"',
      الشرح: 'قبل ما تستخدم متغير، لازم تعطيه قيمة أول.',
      المثال: اسم + ' = "قيمة"\nاطبع(' + اسم + ')'
    };
  }

  // دالة غير معرّفة
  if (رسالة.indexOf('دالة غير معرّفة:') !== -1) {
    const اسم = رسالة.split(':').pop().trim();
    return {
      العنوان: 'ما عرّفت الدالة "' + اسم + '"',
      الشرح: 'عرّف الدالة أول قبل ما تستخدمها. أو تأكد من الاسم.',
      المثال: 'دالة ' + اسم + '(أ، ب) {\n  إرجع أ + ب\n}\nاطبع(' + اسم + '(١، ٢))'
    };
  }

  // تعبير غير مكتمل
  if (رسالة.indexOf('تعبير غير مكتمل') !== -1) {
    return {
      العنوان: 'تعبيرك ناقص',
      الشرح: 'غالباً نسيت علامة تنصيص، أو فتحت قوس وما قفلته.',
      المثال: 'اطبع("أهلاً)    ← غلط\nاطبع("أهلاً")   ← صح'
    };
  }

  // رمز غير متوقع
  if (رسالة.indexOf('رمز غير متوقع:') !== -1) {
    return {
      العنوان: 'فيه رمز ما يشتغل',
      الشرح: 'تأكد من الأقواس ({ }، ( ))، والفواصل. وتأكد إنك ما كتبت ; أو : أو رموز من لغات ثانية.',
      المثال: 'الرموز المدعومة:\n+ - * / % = == != > < >= <= ( ) { } [ ] ، ,'
    };
  }

  // حلقة لا نهائية
  if (رسالة.indexOf('حلقة لا نهائية') !== -1) {
    return {
      العنوان: 'الحلقة ما توقف',
      الشرح: 'حلقة "بينما" تستمر بدون ما تتوقف. تأكد إن الشرط يتغير داخل الحلقة.',
      المثال: 'س = ٠\nبينما (س < ٥) {\n  اطبع(س)\n  س = س + ١\n}'
    };
  }

  return null;
}

var المكتبات = {
  'رقم': function(ق) { return Number(ق); },
  'عدد': function(ق) { return Number(ق); },
  'جذر': function(ن) { return Math.sqrt(Number(ن)); },
  'قوة': function(أ, ب) { return Math.pow(Number(أ), Number(ب)); },
  'مطلق': function(ن) { return Math.abs(Number(ن)); },
  'أكبر': function(أ, ب) { return Math.max(Number(أ), Number(ب)); },
  'أصغر': function(أ, ب) { return Math.min(Number(أ), Number(ب)); },
  'دائري': function(ن) { return Math.round(Number(ن)); },
  'أرضية': function(ن) { return Math.floor(Number(ن)); },
  'سقفية': function(ن) { return Math.ceil(Number(ن)); },
  'عشوائي': function(أ, ب) { return Math.floor(Math.random() * (Number(ب) - Number(أ) + 1)) + Number(أ); },
  'باي': function() { return Math.PI; },
  'مجموع': function(ق) { return ق.reduce(function(س, ع) { return س + Number(ع); }, 0); },
  'طول': function(ن) { return String(ن).length; },
  'جزء': function(ن, م, إ) { return String(ن).slice(Number(م), Number(إ)); },
  'يحتوي': function(ن, ج) { return String(ن).indexOf(String(ج)) !== -1; },
  'استبدل': function(ن, ق, ج) { return String(ن).split(String(ق)).join(String(ج)); },
  'قسم': function(ن, ف) { return String(ن).split(String(ف)); },
  'رابط': function(ق, ف) { return ق.join(ف || ' '); },
  'أزل_فراغ': function(ن) { return String(ن).trim(); },
  'كبير': function(ن) { return String(ن).toUpperCase(); },
  'صغير': function(ن) { return String(ن).toLowerCase(); },
  'طول_قائمة': function(ق) { return ق.length; },
  'رتب': function(ق) { return ق.slice().sort(function(أ, ب) { return أ > ب ? 1 : -1; }); },
  'اعكس': function(ق) { return ق.slice().reverse(); },
  'أول': function(ق) { return ق[0]; },
  'آخر': function(ق) { return ق[ق.length - 1]; },
  'السنة': function() { return new Date().getFullYear(); },
  'الشهر': function() { return new Date().getMonth() + 1; },
  'اليوم': function() { return new Date().getDate(); },
  'الساعة': function() { return new Date().getHours(); },
  'الدقيقة': function() { return new Date().getMinutes(); },
  'تاريخ_اليوم': function() { return new Date().toLocaleDateString('ar-EG'); },
  'اطلب': function(س) { return prompt(String(س)) || ''; },
  'تأكيد': function(س) { return confirm(String(س)); },
  'نبه': function(ر) { alert(String(ر)); return null; },
  'لون_عشوائي': function() { return '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0'); },
  'لون_فاتح': function() { return '#' + ['e3f2fd','e8f5e9','fce4ec','fff8e1','f3e5f5','f0f9ff'][Math.floor(Math.random()*6)]; }
};

var الكلمات_المحجوزة = ['متغير','اطبع','إذا','آخر','كرر','من','إلى','دالة','إرجع','بينما','و','أو','أضف_نص','أضف_عنوان','غير_اللون','أضف_زر','أضف_رابط','أضف_صورة','عيّن_الخط'];

function tokenize(code) {
  code = تحويل_الأرقام_للإنجليزية(code);
  var tokens = [];
  var regex = /\s*(#[^\n]*|\/\/[^\n]*|==|!=|>=|<=|[=<>+\-*/%(){}\[\],،!]|"[^"]*"|'[^']*'|[\p{L}_][\p{L}\p{N}_]*|\d+(?:\.\d+)?)/gu;
  var m;
  while ((m = regex.exec(code)) !== null) {
    var value = m[1];
    if (value.charAt(0) === '#' || value.substring(0, 2) === '//') continue;
    var type = 'معرف';
    if (الكلمات_المحجوزة.indexOf(value) !== -1) type = 'كلمة_محجوزة';
    else if (/^\d/.test(value)) type = 'رقم';
    else if (/^["']/.test(value)) { type = 'نص'; value = value.slice(1, -1); }
    else if (/^[=<>+\-*/%(){}\[\],،!]/.test(value)) type = 'رمز';
    tokens.push({ type: type, value: value });
  }
  tokens.push({ type: 'نهاية', value: '' });
  return tokens;
}

function parse(tokens) {
  var pos = 0;
  function peek(ن) { if (ن === undefined) ن = 0; return tokens[pos + ن] || tokens[tokens.length - 1]; }
  function consume() { return tokens[pos++]; }
  function expect(v) {
    if (peek().value !== v) throw new Error('متوقع "' + v + '" لكن وجدت "' + (peek().value || 'نهاية') + '"');
    return consume();
  }

  function parseProgram() { var b = []; while (peek().type !== 'نهاية') b.push(parseStatement()); return { type: 'برنامج', body: b }; }

  function parseStatement() {
    var t = peek();
    if (t.type === 'كلمة_محجوزة') {
      if (['أضف_نص','أضف_عنوان','غير_اللون','أضف_زر','أضف_رابط','أضف_صورة','عيّن_الخط'].indexOf(t.value) !== -1) return parsePageCall();
      if (t.value === 'اطبع') return parsePrint();
      if (t.value === 'متغير') return parseVar();
      if (t.value === 'إذا') return parseIf();
      if (t.value === 'بينما') return parseWhile();
      if (t.value === 'كرر') return parseRepeat();
      if (t.value === 'دالة') return parseFunc();
      if (t.value === 'إرجع') return parseReturn();
    }
    if (t.type === 'معرف' && peek(1).value === '=') {
      var n = consume().value; consume();
      return { type: 'متغير', name: n, val: parseExpression() };
    }
    return { type: 'تعبير', expr: parseExpression() };
  }

  function parsePageCall() {
    var n = consume().value; expect('(');
    var a = [];
    while (peek().value !== ')') { a.push(parseExpression()); if (peek().value === ',' || peek().value === '،') consume(); else break; }
    expect(')');
    return { type: 'استدعاء_صفحة', name: n, args: a };
  }
  function parsePrint() { consume(); expect('('); var e = parseExpression(); expect(')'); return { type: 'طباعة', expr: e }; }
  function parseVar() { consume(); var n = consume().value; var v = null; if (peek().value === '=') { consume(); v = parseExpression(); } return { type: 'متغير', name: n, val: v }; }
  function parseIf() {
    consume(); expect('('); var c = parseExpression(); expect(')');
    var b = parseBlock(); var a = null;
    if (peek().value === 'آخر') { consume(); a = parseBlock(); }
    return { type: 'شرط', cond: c, block: b, alt: a };
  }
  function parseWhile() { consume(); expect('('); var c = parseExpression(); expect(')'); return { type: 'بينما', cond: c, block: parseBlock() }; }
  function parseRepeat() {
    consume();
    if (peek().type === 'معرف' && peek(1).value === 'من') {
      var n = consume().value; consume();
      var f = parseExpression(); consume();
      var t = parseExpression();
      return { type: 'كرر_من_إلى', name: n, from: f, to: t, block: parseBlock() };
    }
    return { type: 'كرر', count: parseExpression(), block: parseBlock() };
  }
  function parseFunc() {
    consume(); var n = consume().value; expect('(');
    var p = [];
    while (peek().value !== ')') { p.push(consume().value); if (peek().value === ',' || peek().value === '،') consume(); else break; }
    expect(')');
    return { type: 'دالة', name: n, params: p, block: parseBlock() };
  }
  function parseReturn() { consume(); if (peek().value === '}' || peek().type === 'نهاية') return { type: 'إرجع', expr: null }; return { type: 'إرجع', expr: parseExpression() }; }
  function parseBlock() { expect('{'); var b = []; while (peek().value !== '}') b.push(parseStatement()); expect('}'); return { type: 'كتلة', body: b }; }

  function parseExpression() { return parseOr(); }
  function parseOr() { var l = parseAnd(); while (peek().value === 'أو') { consume(); l = { type: 'ثنائي', op: 'أو', l: l, r: parseAnd() }; } return l; }
  function parseAnd() { var l = parseComp(); while (peek().value === 'و') { consume(); l = { type: 'ثنائي', op: 'و', l: l, r: parseComp() }; } return l; }
  function parseComp() {
    var l = parseAdd();
    while (['==','!=','>','<','>=','<='].indexOf(peek().value) !== -1) {
      var op = consume().value;
      l = { type: 'ثنائي', op: op, l: l, r: parseAdd() };
    }
    return l;
  }
  function parseAdd() {
    var l = parseMul();
    while (peek().value === '+' || peek().value === '-') {
      var op = consume().value;
      l = { type: 'ثنائي', op: op, l: l, r: parseMul() };
    }
    return l;
  }
  function parseMul() {
    var l = parseUnary();
    while (['*','/','%'].indexOf(peek().value) !== -1) {
      var op = consume().value;
      l = { type: 'ثنائي', op: op, l: l, r: parseUnary() };
    }
    return l;
  }
  function parseUnary() {
    if (peek().value === '-') { consume(); return { type: 'أحادي', op: '-', expr: parseUnary() }; }
    if (peek().value === '!') { consume(); return { type: 'أحادي', op: '!', expr: parseUnary() }; }
    return parseCall();
  }
  function parseCall() {
    var e = parsePrim();
    while (peek().value === '(') {
      consume(); var a = [];
      while (peek().value !== ')') { a.push(parseExpression()); if (peek().value === ',' || peek().value === '،') consume(); else break; }
      expect(')');
      e = { type: 'استدعاء_دالة', callee: e, args: a };
    }
    return e;
  }
  function parsePrim() {
    var t = peek();
    if (!t || t.type === 'نهاية') throw new Error('تعبير غير مكتمل');
    if (t.type === 'رقم') { consume(); return { type: 'رقم', val: parseFloat(t.value) }; }
    if (t.type === 'نص') { consume(); return { type: 'نص', val: t.value }; }
    if (t.value === '(') { consume(); var e = parseExpression(); expect(')'); return e; }
    if (t.value === '[') {
      consume(); var items = [];
      while (peek().value !== ']') { items.push(parseExpression()); if (peek().value === ',' || peek().value === '،') consume(); else break; }
      expect(']');
      return { type: 'مصفوفة', items: items };
    }
    if (t.type === 'معرف' || t.type === 'كلمة_محجوزة') { consume(); return { type: 'متغير_مرجع', name: t.value }; }
    throw new Error('رمز غير متوقع: "' + t.value + '"');
  }

  return parseProgram();
}

function تنفيذ(ast, طباعة) {
  var صندوق = document.getElementById('مخرجات_الويب');
  var بيئة_عالمية = {};
  var دوال = {};

  function تنسيق(v) {
    if (v === null || v === undefined) return '';
    if (typeof v === 'boolean') return v ? 'صحيح' : 'خطأ';
    if (Array.isArray(v)) return '[' + v.map(تنسيق).join('، ') + ']';
    return String(v);
  }

  function قيمة(عقدة, بيئة) {
    if (!عقدة) return null;
    if (عقدة.type === 'رقم' || عقدة.type === 'نص') return عقدة.val;
    if (عقدة.type === 'مصفوفة') return عقدة.items.map(function(i) { return قيمة(i, بيئة); });
    if (عقدة.type === 'متغير_مرجع') {
      if (عقدة.name in بيئة) return بيئة[عقدة.name];
      if (عقدة.name in بيئة_عالمية) return بيئة_عالمية[عقدة.name];
      throw new Error('متغير غير معرّف: ' + عقدة.name);
    }
    if (عقدة.type === 'أحادي') {
      var v = قيمة(عقدة.expr, بيئة);
      return عقدة.op === '-' ? -v : !v;
    }
    if (عقدة.type === 'ثنائي') {
      if (عقدة.op === 'و') {
        var ل1 = قيمة(عقدة.l, بيئة);
        return ل1 ? قيمة(عقدة.r, بيئة) : ل1;
      }
      if (عقدة.op === 'أو') {
        var ل2 = قيمة(عقدة.l, بيئة);
        return ل2 ? ل2 : قيمة(عقدة.r, بيئة);
      }
      var ل = قيمة(عقدة.l, بيئة);
      var ر = قيمة(عقدة.r, بيئة);
      if (عقدة.op === '+') return ل + ر;
      if (عقدة.op === '-') return ل - ر;
      if (عقدة.op === '*') return ل * ر;
      if (عقدة.op === '/') return ل / ر;
      if (عقدة.op === '%') return ل % ر;
      if (عقدة.op === '==') return ل == ر;
      if (عقدة.op === '!=') return ل != ر;
      if (عقدة.op === '>') return ل > ر;
      if (عقدة.op === '<') return ل < ر;
      if (عقدة.op === '>=') return ل >= ر;
      if (عقدة.op === '<=') return ل <= ر;
      throw new Error('عملية غير معروفة: ' + عقدة.op);
    }
    if (عقدة.type === 'استدعاء_دالة') {
      var name = عقدة.callee.name;
      var args = عقدة.args.map(function(a) { return قيمة(a, بيئة); });
      if (دوال[name]) return استدعاء_دالة(دوال[name], args);
      if (المكتبات[name]) return المكتبات[name].apply(null, args);
      throw new Error('دالة غير معرّفة: ' + name);
    }
    throw new Error('لا يمكن تقييم: ' + عقدة.type);
  }

  function استدعاء_دالة(دالة, args) {
    var بيئة_محلية = {};
    دالة.params.forEach(function(p, i) { بيئة_محلية[p] = args[i] !== undefined ? args[i] : null; });
    try {
      for (var i = 0; i < دالة.block.body.length; i++) نفّذ_عقدة(دالة.block.body[i], بيئة_محلية);
    } catch (e) {
      if (e && e.__إرجع) return e.value;
      throw e;
    }
    return null;
  }

  function نفّذ_عقدة(عقدة, بيئة) {
    if (!عقدة) return;
    if (عقدة.type === 'برنامج') {
      for (var i = 0; i < عقدة.body.length; i++) نفّذ_عقدة(عقدة.body[i], بيئة_عالمية);
      return;
    }
    if (عقدة.type === 'كتلة') {
      for (var i = 0; i < عقدة.body.length; i++) نفّذ_عقدة(عقدة.body[i], بيئة);
      return;
    }
    if (عقدة.type === 'متغير') {
      بيئة[عقدة.name] = عقدة.val ? قيمة(عقدة.val, بيئة) : null;
      return;
    }
    if (عقدة.type === 'تعبير') { قيمة(عقدة.expr, بيئة); return; }
    if (عقدة.type === 'طباعة') {
      طباعة(تحويل_الأرقام_للعربية(تنسيق(قيمة(عقدة.expr, بيئة))));
      return;
    }
    if (عقدة.type === 'شرط') {
      if (قيمة(عقدة.cond, بيئة)) نفّذ_عقدة(عقدة.block, بيئة);
      else if (عقدة.alt) نفّذ_عقدة(عقدة.alt, بيئة);
      return;
    }
    if (عقدة.type === 'بينما') {
      var حماية = 0;
      while (قيمة(عقدة.cond, بيئة)) {
        نفّذ_عقدة(عقدة.block, بيئة);
        حماية++;
        if (حماية > 100000) throw new Error('حلقة لا نهائية');
      }
      return;
    }
    if (عقدة.type === 'كرر') {
      var n = Number(قيمة(عقدة.count, بيئة));
      if (!isFinite(n) || n < 0) throw new Error('عدد تكرارات غير صحيح');
      for (var i = 0; i < n; i++) نفّذ_عقدة(عقدة.block, بيئة);
      return;
    }
    if (عقدة.type === 'كرر_من_إلى') {
      var from = Number(قيمة(عقدة.from, بيئة));
      var to = Number(قيمة(عقدة.to, بيئة));
      for (var i = from; i <= to; i++) {
        بيئة[عقدة.name] = i;
        نفّذ_عقدة(عقدة.block, بيئة);
      }
      return;
    }
    if (عقدة.type === 'دالة') {
      دوال[عقدة.name] = { params: عقدة.params, block: عقدة.block };
      return;
    }
    if (عقدة.type === 'إرجع') {
      throw { __إرجع: true, value: عقدة.expr ? قيمة(عقدة.expr, بيئة) : null };
    }
    if (عقدة.type === 'استدعاء_صفحة') { صفحة(عقدة, بيئة); return; }
  }

  function صفحة(عقدة, بيئة) {
    var ق = عقدة.args.map(function(a) { return قيمة(a, بيئة); });
    if (عقدة.name === 'أضف_نص') {
      var p = document.createElement('p');
      p.textContent = تحويل_الأرقام_للعربية(ق.join(''));
      صندوق.appendChild(p);
    } else if (عقدة.name === 'أضف_عنوان') {
      var h = document.createElement('h3');
      h.textContent = تحويل_الأرقام_للعربية(ق.join(''));
      صندوق.appendChild(h);
    } else if (عقدة.name === 'غير_اللون') {
      document.body.style.backgroundColor = String(ق[0] || '#f0f0f0');
    } else if (عقدة.name === 'أضف_زر') {
      var z = document.createElement('a');
      z.href = String(ق[1] || '#');
      z.target = '_blank';
      z.rel = 'noopener';
      z.className = 'زر-عين';
      z.textContent = String(ق[0] || 'زر');
      صندوق.appendChild(z);
    } else if (عقدة.name === 'أضف_رابط') {
      var l = document.createElement('a');
      l.href = String(ق[1] || '#');
      l.target = '_blank';
      l.rel = 'noopener';
      l.textContent = String(ق[0] || 'رابط');
      صندوق.appendChild(document.createElement('br'));
      صندوق.appendChild(l);
    } else if (عقدة.name === 'أضف_صورة') {
      var im = document.createElement('img');
      im.src = String(ق[0] || '');
      im.alt = String(ق[1] || 'صورة');
      صندوق.appendChild(im);
    } else if (عقدة.name === 'عيّن_الخط') {
      صندوق.style.fontFamily = String(ق[0] || 'Tahoma');
      صندوق.style.fontSize = ق[1] ? Number(ق[1]) + 'px' : '16px';
    }
  }

  نفّذ_عقدة(ast, بيئة_عالمية);
}

function شغل() {
  var كود = document.getElementById('كود_عين').value;
  var ناتج = document.getElementById('الناتج');
  var ويب = document.getElementById('مخرجات_الويب');
  ناتج.innerHTML = '';
  ويب.innerHTML = '';

  if (!كود.trim()) {
    ناتج.innerHTML = '<div class="اقتراح"><div class="عنوان">المربع فاضي</div><div class="شرح">اكتب كود أول ثم اضغط تشغيل.</div></div>';
    return;
  }

  try {
    var رموز = tokenize(كود);
    var شجرة = parse(رموز);
    var مخرجات_نص = '';
    تنفيذ(شجرة, function(ر) { مخرجات_نص += ر + '\n'; });
    ناتج.textContent = مخرجات_نص;
  } catch (err) {
    var رسالة = (err && err.message) ? err.message : String(err);
    var html = '<div class="خطأ-عنوان">خطأ: ' + رسالة + '</div>';
    var اقتراح = اقترح_حل(err);
    if (اقتراح) {
      html += '<div class="اقتراح">';
      html += '<div class="عنوان">' + اقتراح.العنوان + '</div>';
      html += '<div class="شرح">' + اقتراح.الشرح + '</div>';
      if (اقتراح.المثال) {
        html += '<div class="مثال-عنوان">📝 مثال صحيح:</div>';
        html += '<pre>' + اقتراح.المثال + '</pre>';
      }
      html += '</div>';
    } else {
      html += '<div class="اقتراح"><div class="عنوان">نصيحة</div>';
      html += '<div class="شرح">راجع الكود، وتأكد من الأقواس والفواصل. أو انسخ الرسالة وأرسلها لـ نبراس GP.</div></div>';
    }
    ناتج.innerHTML = html;
  }
}

function احفظ() {
  var كودي = document.getElementById('كود_عين').value;
  var ب = new Blob(['\uFEFF' + كودي], { type: 'text/plain;charset=utf-8' });
  var ر = document.createElement('a');
  ر.href = URL.createObjectURL(ب);
  ر.download = 'كود_عين.txt';
  document.body.appendChild(ر);
  ر.click();
  document.body.removeChild(ر);
  URL.revokeObjectURL(ر.href);
}

function انسخ() {
  var ن = document.getElementById('الناتج').innerText;
  if (!ن.trim()) { alert('لا يوجد نص لنسخه'); return; }
  var ta = document.createElement('textarea');
  ta.value = ن;
  ta.style.position = 'fixed';
  ta.style.top = '-1000px';
  document.body.appendChild(ta);
  ta.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  alert(ok ? 'تم النسخ' : 'فشل النسخ');
}

function امسح_الكود() { if (confirm('مسح الكود؟')) document.getElementById('كود_عين').value = ''; }
function امسح_الناتج() { document.getElementById('الناتج').innerHTML = ''; document.getElementById('مخرجات_الويب').innerHTML = ''; }
</script>
