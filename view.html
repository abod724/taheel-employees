<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>لغة عين</title>
<style>
body{font-family:sans-serif;padding:20px;background:#f0f0f0;direction:rtl;transition:background-color .5s,color .5s}
textarea{width:100%;height:180px;font-family:monospace;font-size:15px;padding:10px;border-radius:5px;border:1px solid #ccc;box-sizing:border-box}
#الناتج{white-space:pre-wrap;background:#1e1e1e;color:#0f0;padding:10px;margin-top:10px;border-radius:5px;font-family:monospace;min-height:40px}
#مخرجات_الويب{background:transparent;padding:15px;margin-top:10px;border:2px dashed #007bff;border-radius:8px;min-height:80px;color:inherit}
button{padding:10px 14px;margin:10px 4px 0 0;font-size:15px;cursor:pointer;border:none;border-radius:5px;color:#fff}
.b1{background:#007bff}.b2{background:#ffc107;color:#000}.b3{background:#dc3545}
</style>
</head>
<body>
<h1 id="h1">مترجم لغة عين</h1>
<p id="p1">اكتب كود بلغة عين:</p>
<textarea id="كود_عين">غير_اللون("كحلي")
غير_لون_النص("ابيض")

أضف_عنوان("🌟 لغة عين")

متغير س = ١٠
متغير ص = ٣

أضف_عنوان("١️⃣ الحساب:")
أضف_نص("جمع: " + (س + ص))
أضف_نص("طرح: " + (س - ص))
أضف_نص("ضرب: " + (س * ص))
أضف_نص("قسمة: " + تدوير(س / ص, ٢))
أضف_نص("باقي: " + (س % ص))

أضف_عنوان("٢️⃣ الشروط:")
إذا (س > ٥ و ص < ٥) {
  أضف_نص("✅ تحقق")
} آخر {
  أضف_نص("❌ فشل")
}

أضف_عنوان("٣️⃣ القوائم:")
متغير أسماء = ["أحمد", "محمد", "خالد"]
كرر من ٠ إلى ٢ {
  أضف_نص("• " + أسماء[i])
}

أضف_عنوان("٤️⃣ الدوال:")
دالة جمع(أ، ب) {
  إرجع أ + ب
}
أضف_نص("جمع(٧، ٣) = " + جمع(٧، ٣))

أضف_عنوان("٥️⃣ الرياضية:")
أضف_نص("القوة(٢، ٥) = " + القوة(٢، ٥))
أضف_نص("الجذر(٢٥) = " + الجذر(٢٥))
أضف_نص("العشوائي: " + العشوائي(١، ١٠٠))

غير_اللون("بنفسجي")
غير_لون_النص("ذهبي")
أضف_عنوان("🎨 تغيرت الألوان!")</textarea><br>
<button class="b1" onclick="شغل()">▶ تشغيل</button>
<button class="b2" onclick="احفظ()">💾 حفظ</button>
<button class="b1" onclick="انسخ()">📋 نسخ</button>
<button class="b3" onclick="امسح_الكود()">🗑️ مسح الكود</button>
<button class="b3" onclick="امسح_الناتج()">🧹 مسح الناتج</button>

<h2 id="h2">📟 الناتج (وحدة التحكم):</h2>
<div id="الناتج"></div>

<h2 id="h3">🖥️ النتيجة على الويب:</h2>
<div id="مخرجات_الويب"></div>

<script>
function ع2إ(s){const m={'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};return s.replace(/[٠-٩]/g,c=>m[c]);}
function إ2ع(s){const m={'0':'٠','1':'١','2':'٢','3':'٣','4':'٤','5':'٥','6':'٦','7':'٧','8':'٨','9':'٩'};return String(s).replace(/[0-9]/g,c=>m[c]);}
const الألوان={'احمر':'#e74c3c','أحمر':'#e74c3c','ازرق':'#3498db','أزرق':'#3498db','اخضر':'#27ae60','أخضر':'#27ae60','اصفر':'#f1c40f','أصفر':'#f1c40f','ابيض':'#ffffff','أبيض':'#ffffff','اسود':'#000000','أسود':'#000000','برتقالي':'#e67e22','بنفسجي':'#8e44ad','وردي':'#e91e63','رمادي':'#7f8c8d','بني':'#8b4513','سماوي':'#87ceeb','ذهبي':'#ffd700','فضي':'#c0c0c0','تركوازي':'#1abc9c','كحلي':'#1a1a2e','شفاف':'transparent'};
function لون(x){if(typeof x!=='string')return String(x);const t=x.trim();if(t.startsWith('#')||t.startsWith('rgb'))return t;return الألوان[t]||t;}
function tokenize(code){
  code=code.replace(/[\u200B-\u200D\uFEFF\u200E\u200F]/g,'');
  code=ع2إ(code);code=code.replace(/\/\/.*$/gm,'');
  const t=[];const re=/\s*(متغير|اطبع|إذا|آخر|كرر|من|إلى|دالة|إرجع|بينما|و|أو|[a-zA-Z\u0621-\u064A_][a-zA-Z0-9\u0621-\u064A_]*|\d+|"[^"]*"|'[^']*'|==|!=|>=|<=|[=><+\-*/%{}()\[\]،,])/g;
  let m;while((m=re.exec(code))!==null){let v=m[1],ty='معرف';
    if(['متغير','اطبع','إذا','آخر','كرر','من','إلى','دالة','إرجع','بينما','و','أو'].includes(v))ty='كلمة';
    else if(/^\d+$/.test(v))ty='رقم';
    else if(/^["'].*["']$/.test(v)){ty='نص';v=v.slice(1,-1);}
    else if(['=','>','<','==','!=','>=','<=','+','-','*','/','%','{','}','(',')','[',']','،',','].includes(v))ty='رمز';
    t.push({type:ty,value:v});}
  return t;
}
function parse(t){
  let p=0;const pk=()=>t[p],pn=()=>t[p+1],cs=()=>t[p++];
  function prog(){const s=[];while(p<t.length)s.push(stmt());return{type:'برنامج',body:s};}
  function stmt(){
    const tk=pk();if(!tk)return null;
    if(tk.type==='معرف'&&pn()&&pn().value==='='){const n=cs().value;cs();return{type:'إعادة',name:n,value:expr()};}
    if(tk.type==='كلمة'){
      if(tk.value==='متغير'){cs();const n=cs().value;let v=null;if(pk()&&pk().value==='='){cs();v=expr();}return{type:'متغير',name:n,value:v};}
      if(tk.value==='اطبع'){cs();return{type:'اطبع',value:expr()};}
      if(tk.value==='إذا'){cs();cs();const c=expr();cs();const th=block();let el=null;if(pk()&&pk().value==='آخر'){cs();el=block();}return{type:'إذا',c,th,el};}
      if(tk.value==='كرر'){cs();cs();const a=expr();cs();const b=expr();return{type:'كرر',a,b,body:block()};}
      if(tk.value==='بينما'){cs();cs();const c=expr();cs();return{type:'بينما',c,body:block()};}
      if(tk.value==='دالة'){cs();const n=cs().value;cs();const ps=[];while(pk()&&pk().value!==')'){if(pk().value==='،'||pk().value===','){cs();continue;}ps.push(cs().value);}cs();return{type:'دالة',name:n,params:ps,body:block()};}
      if(tk.value==='إرجع'){cs();return{type:'إرجع',value:expr()};}
    }
    return expr();
  }
  function block(){cs();const b=[];while(pk()&&pk().value!=='}')b.push(stmt());cs();return{type:'كتلة',body:b};}
  function expr(){let l=cmp();while(pk()&&(pk().value==='و'||pk().value==='أو')){const op=cs().value;l={type:'منطقي',op,l,r:cmp()};}return l;}
  function cmp(){let l=add();while(pk()&&['>','<','==','!=','>=','<='].includes(pk().value)){const op=cs().value;l={type:'ثنائي',op,l,r:add()};}return l;}
  function add(){let l=mul();while(pk()&&(pk().value==='+'||pk().value==='-')){const op=cs().value;l={type:'ثنائي',op,l,r:mul()};}return l;}
  function mul(){let l=prim();while(pk()&&(pk().value==='*'||pk().value==='/'||pk().value==='%')){const op=cs().value;l={type:'ثنائي',op,l,r:prim()};}return l;}
  function prim(){
    const tk=cs();if(!tk)throw new Error("نهاية غير متوقعة");
    if(tk.type==='رقم')return{type:'رقم',value:parseInt(tk.value)};
    if(tk.type==='نص')return{type:'نص',value:tk.value};
    if(tk.value==='('){const e=expr();cs();return e;}
    if(tk.value==='['){const el=[];while(pk()&&pk().value!==']'){if(pk().value==='،'||pk().value===','){cs();continue;}el.push(expr());}cs();return{type:'قائمة',el};}
    const مد=['الطول','النوع','تحويل_لنص','تحويل_لرقم','العشوائي','القوة','الجذر','تدوير','أضف_نص','أضف_عنوان','غير_اللون','غير_لون_النص','امسح_الصفحة','اطلب'];
    if(مد.includes(tk.value)){cs();const a=[];while(pk()&&pk().value!==')'){if(pk().value==='،'||pk().value===','){cs();continue;}a.push(expr());}cs();return{type:'مدمج',name:tk.value,args:a};}
    if(tk.type==='معرف'){
      if(pk()&&pk().value==='('){cs();const a=[];while(pk()&&pk().value!==')'){if(pk().value==='،'||pk().value===','){cs();continue;}a.push(expr());}cs();return{type:'استدعاء',name:tk.value,args:a};}
      if(pk()&&pk().value==='['){cs();const i=expr();cs();return{type:'عنصر',name:tk.value,i};}
      return{type:'معرف',name:tk.value};
    }
    throw new Error('خطأ في التحليل: '+tk.value);
  }
  return prog();
}
class بيئة{
  constructor(أ=null){this.ق={};this.أ=أ;}
  def(n,v){this.ق[n]=v;}
  set(n,v){if(Object.prototype.hasOwnProperty.call(this.ق,n)){this.ق[n]=v;return;}if(this.أ){this.أ.set(n,v);return;}throw new Error('متغير غير موجود: '+n);}
  get(n){if(Object.prototype.hasOwnProperty.call(this.ق,n))return this.ق[n];if(this.أ)return this.أ.get(n);throw new Error('متغير غير معرف: '+n);}
}
function evalAST(ast,env,out){
  function ev(n,e){
    if(!n)return;
    switch(n.type){
      case 'برنامج':n.body.forEach(c=>ev(c,e));break;
      case 'متغير':e.def(n.name,n.value?ev(n.value,e):null);break;
      case 'إعادة':e.set(n.name,ev(n.value,e));break;
      case 'اطبع':out(ev(n.value,e));break;
      case 'إذا':if(ev(n.c,e))ev(n.th,e);else if(n.el)ev(n.el,e);break;
      case 'كرر':{const a=ev(n.a,e),b=ev(n.b,e);for(let i=a;i<=b;i++){e.def('i',i);ev(n.body,e);}break;}
      case 'بينما':while(ev(n.c,e))ev(n.body,e);break;
      case 'كتلة':n.body.forEach(c=>ev(c,e));break;
      case 'دالة':e.def(n.name,{t:'دالة',ps:n.params,body:n.body,env:e});break;
      case 'استدعاء':{
        const f=e.get(n.name),a=n.args.map(x=>ev(x,e));
        if(f.t==='دالة'){const fe=new بيئة(f.env);f.ps.forEach((p,i)=>fe.def(p,a[i]!==undefined?a[i]:null));try{ev(f.body,fe);}catch(x){if(x.t==='إرجع')return x.value;throw x;}return null;}
        if(f.t==='مدمجة')return f.fn(a);
        throw new Error(n.name+' ليست دالة');
      }
      case 'مدمج':{
        const a1=n.args.length>0?ev(n.args[0],e):null;
        const a2=n.args.length>1?ev(n.args[1],e):null;
        switch(n.name){
          case 'الطول':if(typeof a1!=='string'&&!Array.isArray(a1))throw new Error('الطول تتوقع نص أو قائمة');return a1.length;
          case 'النوع':if(Array.isArray(a1))return'قائمة';if(typeof a1==='number')return'رقم';if(typeof a1==='string')return'نص';return typeof a1;
          case 'تحويل_لنص':return String(a1);
          case 'تحويل_لرقم':{const num=Number(ع2إ(String(a1)));if(isNaN(num))throw new Error('لا يمكن تحويل "'+a1+'" إلى رقم');return num;}
          case 'العشوائي':{const mn=a1||0,mx=a2||10;return Math.floor(Math.random()*(mx-mn+1))+mn;}
          case 'القوة':return Math.pow(a1,a2);
          case 'الجذر':if(a1<0)throw new Error('جذر سالب');return Math.sqrt(a1);
          case 'تدوير':{const d=a2!=null?Number(a2):0;return Number(Number(a1).toFixed(d));}
        }break;
      }
      case 'إرجع':throw{t:'إرجع',value:ev(n.value,e)};
      case 'قائمة':return n.el.map(x=>ev(x,e));
      case 'عنصر':{const l=e.get(n.name);if(!Array.isArray(l))throw new Error(n.name+' ليست قائمة');const i=ev(n.i,e);if(i<0||i>=l.length)throw new Error('الفهرس '+i+' خارج النطاق');return l[i];}
      case 'منطقي':{const l=ev(n.l,e);if(n.op==='و')return l&&ev(n.r,e);return l||ev(n.r,e);}
      case 'ثنائي':{const l=ev(n.l,e),r=ev(n.r,e);switch(n.op){case'>':return l>r;case'<':return l<r;case'==':return l==r;case'!=':return l!=r;case'>=':return l>=r;case'<=':return l<=r;case'+':return l+r;case'-':return l-r;case'*':return l*r;case'/':return l/r;case'%':return l%r;}}
      case 'رقم':return n.value;
      case 'نص':return n.value;
      case 'معرف':return e.get(n.name);
    }
  }
  env.def('اطلب',{t:'مدمجة',fn:a=>{const r=prompt(a[0]?String(a[0]):'أدخل قيمة:');return r===null?'':String(r);}});
  env.def('أضف_نص',{t:'مدمجة',fn:a=>{const c=document.getElementById('مخرجات_الويب');const p=document.createElement('p');p.textContent=a.map(x=>String(x)).join(' ');p.style.margin='5px 0';c.appendChild(p);return null;}});
  env.def('أضف_عنوان',{t:'مدمجة',fn:a=>{const c=document.getElementById('مخرجات_الويب');const h=document.createElement('h3');h.textContent=a.map(x=>String(x)).join(' ');h.style.margin='10px 0 5px 0';h.style.color='#3498db';c.appendChild(h);return null;}});
  env.def('غير_اللون',{t:'مدمجة',fn:a=>{const c=لون(a[0]||'#f0f0f0');document.body.style.backgroundColor=c;document.getElementById('مخرجات_الويب').style.backgroundColor=c;return null;}});
  env.def('غير_لون_النص',{t:'مدمجة',fn:a=>{const c=لون(a[0]||'#000');['مخرجات_الويب','h1','p1','h2','h3'].forEach(id=>{const el=document.getElementById(id);if(el)el.style.color=c;});return null;}});
  env.def('امسح_الصفحة',{t:'مدمجة',fn:()=>{reset();return null;}});
  ev(ast,env);
}
function reset(){
  const w=document.getElementById('مخرجات_الويب');w.innerHTML='';
  w.style.backgroundColor='transparent';w.style.color='inherit';
  document.body.style.backgroundColor='#f0f0f0';
  ['h1','p1','h2','h3'].forEach(id=>{const el=document.getElementById(id);if(el)el.style.color='';});
}
function شغل(){
  const code=document.getElementById('كود_عين').value;
  const out=document.getElementById('الناتج');
  out.innerText='';reset();
  try{const t=tokenize(code);const a=parse(t);const e=new بيئة();
    evalAST(a,e,msg=>{out.innerText+=إ2ع(msg)+'\n';});
  }catch(err){out.innerText='❌ خطأ: '+err.message;}
}
function احفظ(){const c=document.getElementById('كود_عين').value;const b=new Blob([c],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='الكود.ain';a.click();}
function انسخ(){const t=document.getElementById('الناتج').innerText;if(!t.trim()){alert('لا يوجد ناتج!');return;}navigator.clipboard.writeText(t).then(()=>alert('تم النسخ!'));}
function امسح_الكود(){if(document.getElementById('كود_عين').value.trim()===''){alert('فارغ!');return;}if(confirm('مسح الكود؟'))document.getElementById('كود_عين').value='';}
function امسح_الناتج(){document.getElementById('الناتج').innerText='';reset();}
</script>
</body>
</html>
