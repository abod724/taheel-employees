<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>لغة عين - النسخة الاحترافية</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f0f0f0; direction: rtl; transition: background-color 0.5s, color 0.5s; }
    textarea { width: 100%; height: 200px; font-family: monospace; font-size: 16px; padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
    #الناتج { white-space: pre-wrap; background: #1e1e1e; color: #0f0; padding: 10px; margin-top: 10px; border-radius: 5px; font-family: monospace; min-height: 50px; }
    #مخرجات_الويب { background: transparent; padding: 15px; margin-top: 10px; border: 2px dashed #007bff; border-radius: 8px; min-height: 100px; color: inherit; }
    button { padding: 10px 15px; margin-top: 10px; font-size: 15px; margin-left: 5px; cursor: pointer; border: none; border-radius: 5px; color: white; }
    .btn-primary { background: #007bff; }
    .btn-danger { background: #dc3545; }
    .btn-warning { background: #ffc107; color: black; }
  </style>
</head>
<body>
  <h1 id="العنوان_الرئيسي">مترجم لغة عين (النسخة الاحترافية)</h1>
  <p id="الوصف">اكتب كود بلغة عين (استخدم الأرقام العربية ٠-٩):</p>
  <textarea id="كود_عين">اطبع "هذا يظهر في الصندوق الأسود"
أضف_نص("هذا يظهر في الصندوق الأزرق")</textarea><br>
  <button class="btn-primary" onclick="شغل()">▶ تشغيل</button>
  <button class="btn-warning" onclick="احفظ()">💾 حفظ الكود</button>
  <button class="btn-primary" onclick="انسخ()">📋 نسخ الناتج</button>
  <button class="btn-danger" onclick="امسح_الكود()">🗑️ مسح الكود</button>
  <button class="btn-danger" onclick="امسح_الناتج()">🧹 مسح الناتج</button>

  <h2 id="عنوان_النتيجة">📟 الناتج (وحدة التحكم):</h2>
  <div id="الناتج"></div>

  <h2 id="عنوان_الويب">🖥️ النتيجة على الويب (تفاعلية):</h2>
  <div id="مخرجات_الويب"></div>

  <script>
    function تحويل_الأرقام_للإنجليزية(نص) {
      const خريطة = { '٠': '0', '١': '1', '٢': '2', '٣': '3', '٤': '4', '٥': '5', '٦': '6', '٧': '7', '٨': '8', '٩': '9' };
      return نص.replace(/[٠-٩]/g, (حرف) => خريطة[حرف]);
    }
    function تحويل_الأرقام_للعربية(نص) {
      const خريطة = { '0': '٠', '1': '١', '2': '٢', '3': '٣', '4': '٤', '5': '٥', '6': '٦', '7': '٧', '8': '٨', '9': '٩' };
      return String(نص).replace(/[0-9]/g, (رقم) => خريطة[رقم]);
    }

    const الألوان_العربية = {
      'احمر': '#e74c3c', 'أحمر': '#e74c3c', 'ازرق': '#3498db', 'أزرق': '#3498db',
      'اخضر': '#27ae60', 'أخضر': '#27ae60', 'اصفر': '#f1c40f', 'أصفر': '#f1c40f',
      'ابيض': '#ffffff', 'أبيض': '#ffffff', 'اسود': '#000000', 'أسود': '#000000',
      'برتقالي': '#e67e22', 'بنفسجي': '#8e44ad', 'وردي': '#e91e63', 'رمادي': '#7f8c8d',
      'بني': '#8b4513', 'سماوي': '#87ceeb', 'ذهبي': '#ffd700', 'فضي': '#c0c0c0',
      'تركوازي': '#1abc9c', 'كحلي': '#1a1a2e', 'شفاف': 'transparent'
    };
    function حل_لون(لون) {
      if (typeof لون !== 'string') return String(لون);
      const م = لون.trim();
      if (م.startsWith('#') || م.startsWith('rgb')) return م;
      return الألوان_العربية[م] || م;
    }

    function tokenize(code) {
      code = code.replace(/[\u200B-\u200D\uFEFF\u200E\u200F]/g, '');
      code = تحويل_الأرقام_للإنجليزية(code);
      code = code.replace(/\/\/.*$/gm, '');
      const tokens = [];
      const regex = /\s*(متغير|اطبع|إذا|آخر|كرر|من|إلى|دالة|إرجع|بينما|و|أو|[a-zA-Z\u0621-\u064A_][a-zA-Z0-9\u0621-\u064A_]*|\d+|"[^"]*"|'[^']*'|==|!=|>=|<=|[=><+\-*/%{}()\[\]،,])/g;
      let match;
      while ((match = regex.exec(code)) !== null) {
        let value = match[1];
        let type = 'معرف';
        if (['متغير', 'اطبع', 'إذا', 'آخر', 'كرر', 'من', 'إلى', 'دالة', 'إرجع', 'بينما', 'و', 'أو'].includes(value)) type = 'كلمة_محجوزة';
        else if (/^\d+$/.test(value)) type = 'رقم';
        else if (/^["'].*["']$/.test(value)) { type = 'نص'; value = value.slice(1, -1); }
        else if (['=', '>', '<', '==', '!=', '>=', '<=', '+', '-', '*', '/', '%', '{', '}', '(', ')', '[', ']', '،', ','].includes(value)) type = 'رمز';
        tokens.push({ type, value });
      }
      return tokens;
    }

    function parse(tokens) {
      let pos = 0;
      function peek() { return tokens[pos]; }
      function peekNext() { return tokens[pos + 1]; }
      function consume() { return tokens[pos++]; }

      function parseProgram() { const s = []; while (pos < tokens.length) s.push(parseStatement()); return { type: 'برنامج', body: s }; }

      function parseStatement() {
        const token = peek();
        if (!token) return null;
        if (token.type === 'معرف' && peekNext() && peekNext().value === '=') {
          const name = consume().value; consume();
          const value = parseExpression();
          return { type: 'إعادة_تعيين', name, value };
        }
        if (token.type === 'كلمة_محجوزة') {
          if (token.value === 'متغير') {
            consume(); const name = consume().value; let value = null;
            if (peek() && peek().value === '=') { consume(); value = parseExpression(); }
            return { type: 'إعلان_متغير', name, value };
          }
          if (token.value === 'اطبع') { consume(); return { type: 'جملة_طباعة', value: parseExpression() }; }
          if (token.value === 'إذا') {
            consume(); consume(); const condition = parseExpression(); consume();
            const consequent = parseBlock(); let alternate = null;
            if (peek() && peek().value === 'آخر') { consume(); alternate = parseBlock(); }
            return { type: 'جملة_شرطية', condition, consequent, alternate };
          }
          if (token.value === 'كرر') {
            consume(); consume(); const start = parseExpression(); consume(); const end = parseExpression();
            return { type: 'جملة_تكرار', start, end, body: parseBlock() };
          }
          if (token.value === 'بينما') { consume(); consume(); const condition = parseExpression(); consume(); return { type: 'جملة_بينما', condition, body: parseBlock() }; }
          if (token.value === 'دالة') {
            consume(); const name = consume().value; consume();
            const params = [];
            while (peek() && peek().value !== ')') { if (peek().value === '،' || peek().value === ',') { consume(); continue; } params.push(consume().value); }
            consume();
            return { type: 'دالة', name, params, body: parseBlock() };
          }
          if (token.value === 'إرجع') { consume(); return { type: 'إرجع', value: parseExpression() }; }
        }
        return parseExpression();
      }

      function parseBlock() {
        consume(); const body = [];
        while (peek() && peek().value !== '}') body.push(parseStatement());
        consume();
        return { type: 'كتلة', body };
      }

      function parseExpression() {
        let left = parseComparison();
        while (peek() && (peek().value === 'و' || peek().value === 'أو')) {
          const op = consume().value; left = { type: 'تعبير_منطقي', operator: op, left, right: parseComparison() };
        }
        return left;
      }
      function parseComparison() {
        let left = parseAdditive();
        while (peek() && ['>', '<', '==', '!=', '>=', '<='].includes(peek().value)) {
          const op = consume().value; left = { type: 'تعبير_ثنائي', operator: op, left, right: parseAdditive() };
        }
        return left;
      }
      function parseAdditive() {
        let left = parseMultiplicative();
        while (peek() && (peek().value === '+' || peek().value === '-')) {
          const op = consume().value; left = { type: 'تعبير_ثنائي', operator: op, left, right: parseMultiplicative() };
        }
        return left;
      }
      function parseMultiplicative() {
        let left = parsePrimary();
        while (peek() && (peek().value === '*' || peek().value === '/' || peek().value === '%')) {
          const op = consume().value; left = { type: 'تعبير_ثنائي', operator: op, left, right: parsePrimary() };
        }
        return left;
      }

      function parsePrimary() {
        const token = consume();
        if (!token) throw new Error("نهاية غير متوقعة");
        if (token.type === 'رقم') return { type: 'رقم', value: parseInt(token.value) };
        if (token.type === 'نص') return { type: 'نص', value: token.value };
        if (token.value === '(') {
          const expr = parseExpression(); consume();
          return expr;
        }
        if (token.value === '[') {
          const el = [];
          while (peek() && peek().value !== ']') { if (peek().value === '،' || peek().value === ',') { consume(); continue; } el.push(parseExpression()); }
          consume();
          return { type: 'قائمة', elements: el };
        }
        const مدمجة = ['الطول','النوع','تحويل_لنص','تحويل_لرقم','العشوائي','القوة','الجذر','تدوير','أضف_نص','أضف_عنوان','غير_اللون','غير_لون_النص','امسح_الصفحة','اطلب'];
        if (مدمجة.includes(token.value)) {
          consume(); const args = [];
          while (peek() && peek().value !== ')') { if (peek().value === '،' || peek().value === ',') { consume(); continue; } args.push(parseExpression()); }
          consume();
          return { type: 'استدعاء_مدمج', name: token.value, args };
        }
        if (token.type === 'معرف') {
          if (peek() && peek().value === '(') {
            consume(); const args = [];
            while (peek() && peek().value !== ')') { if (peek().value === '،' || peek().value === ',') { consume(); continue; } args.push(parseExpression()); }
            consume();
            return { type: 'استدعاء_دالة', name: token.value, args };
          }
          if (peek() && peek().value === '[') { consume(); const index = parseExpression(); consume(); return { type: 'وصول_قائمة', name: token.value, index }; }
          return { type: 'معرف', name: token.value };
        }
        throw new Error(`خطأ في التحليل: ${token.value}`);
      }
      return parseProgram();
    }

    class البيئة {
      constructor(الأب = null) { this.القيم = {}; this.الأب = الأب; }
      تعريف(اسم, قيمة) { this.القيم[اسم] = قيمة; }
      تحديث(اسم, قيمة) {
        if (Object.prototype.hasOwnProperty.call(this.القيم, اسم)) { this.القيم[اسم] = قيمة; return; }
        if (this.الأب) { this.الأب.تحديث(اسم, قيمة); return; }
        throw new Error(`لا يمكن إعادة تعيين متغير غير موجود: ${اسم}`);
      }
      جلب(اسم) {
        if (Object.prototype.hasOwnProperty.call(this.القيم, اسم)) return this.القيم[اسم];
        if (this.الأب) return this.الأب.جلب(اسم);
        throw new Error(`متغير غير معرف: ${اسم}`);
      }
    }

    function evaluate(ast, env, onOutput) {
      function evalNode(node, currentEnv) {
        if (!node) return;
        switch (node.type) {
          case 'برنامج': node.body.forEach(c => evalNode(c, currentEnv)); break;
          case 'إعلان_متغير': currentEnv.تعريف(node.name, node.value ? evalNode(node.value, currentEnv) : null); break;
          case 'إعادة_تعيين': currentEnv.تحديث(node.name, evalNode(node.value, currentEnv)); break;
          case 'جملة_طباعة': onOutput(evalNode(node.value, currentEnv)); break;
          case 'جملة_شرطية':
            if (evalNode(node.condition, currentEnv)) evalNode(node.consequent, currentEnv);
            else if (node.alternate) evalNode(node.alternate, currentEnv);
            break;
          case 'جملة_تكرار': {
            const s = evalNode(node.start, currentEnv), e = evalNode(node.end, currentEnv);
            for (let i = s; i <= e; i++) { currentEnv.تعريف('i', i); evalNode(node.body, currentEnv); }
            break;
          }
          case 'جملة_بينما': while (evalNode(node.condition, currentEnv)) evalNode(node.body, currentEnv); break;
          case 'كتلة': node.body.forEach(c => evalNode(c, currentEnv)); break;
          case 'دالة': currentEnv.تعريف(node.name, { type: 'دالة', params: node.params, body: node.body, env: currentEnv }); break;
          case 'استدعاء_دالة': {
            const func = currentEnv.جلب(node.name);
            const args = node.args.map(a => evalNode(a, currentEnv));
            if (func.type === 'دالة') {
              const fe = new البيئة(func.env);
              func.params.forEach((p, i) => fe.تعريف(p, args[i] !== undefined ? args[i] : null));
              try { evalNode(func.body, fe); } catch (e) { if (e.type === 'إرجع') return e.value; throw e; }
              return null;
            } else if (func.type === 'دالة_مدمجة') return func.fn(args);
            throw new Error(`${node.name} ليست دالة`);
          }
          case 'استدعاء_مدمج': {
            const a1 = node.args.length > 0 ? evalNode(node.args[0], currentEnv) : null;
            const a2 = node.args.length > 1 ? evalNode(node.args[1], currentEnv) : null;
            switch (node.name) {
              case 'الطول': if (typeof a1 !== 'string' && !Array.isArray(a1)) throw new Error(`الطول() تتوقع نصاً أو قائمة`); return a1.length;
              case 'النوع': if (Array.isArray(a1)) return 'قائمة'; if (typeof a1 === 'number') return 'رقم'; if (typeof a1 === 'string') return 'نص'; return typeof a1;
              case 'تحويل_لنص': return String(a1);
              case 'تحويل_لرقم': { const n = Number(تحويل_الأرقام_للإنجليزية(String(a1))); if (isNaN(n)) throw new Error(`لا يمكن تحويل "${a1}"`); return n; }
              case 'العشوائي': { const mn = a1 || 0, mx = a2 || 10; return Math.floor(Math.random() * (mx - mn + 1)) + mn; }
              case 'القوة': return Math.pow(a1, a2);
              case 'الجذر': if (a1 < 0) throw new Error("جذر سالب"); return Math.sqrt(a1);
              case 'تدوير': { const d = a2 !== null && a2 !== undefined ? Number(a2) : 0; return Number(Number(a1).toFixed(d)); }
            }
            break;
          }
          case 'إرجع': throw { type: 'إرجع', value: evalNode(node.value, currentEnv) };
          case 'قائمة': return node.elements.map(e => evalNode(e, currentEnv));
          case 'وصول_قائمة': {
            const list = currentEnv.جلب(node.name);
            if (!Array.isArray(list)) throw new Error(`${node.name} ليست قائمة`);
            const i = evalNode(node.index, currentEnv);
            if (i < 0 || i >= list.length) throw new Error(`الفهرس ${i} خارج النطاق`);
            return list[i];
          }
          case 'تعبير_منطقي': { const l = evalNode(node.left, currentEnv); if (node.operator === 'و') return l && evalNode(node.right, currentEnv); return l || evalNode(node.right, currentEnv); }
          case 'تعبير_ثنائي': {
            const l = evalNode(node.left, currentEnv), r = evalNode(node.right, currentEnv);
            switch (node.operator) {
              case '>': return l > r; case '<': return l < r;
              case '==': return l == r; case '!=': return l != r;
              case '>=': return l >= r; case '<=': return l <= r;
              case '+': return l + r; case '-': return l - r;
              case '*': return l * r; case '/': return l / r; case '%': return l % r;
            }
            break;
          }
          case 'رقم': return node.value;
          case 'نص': return node.value;
          case 'معرف': return currentEnv.جلب(node.name);
        }
      }

      env.تعريف('اطلب', { type: 'دالة_مدمجة', fn: (args) => prompt(args[0] ? String(args[0]) : "أدخل قيمة:") || "" });
      env.تعريف('أضف_نص', { type: 'دالة_مدمجة', fn: (args) => {
        const c = document.getElementById('مخرجات_الويب');
        const p = document.createElement('p');
        p.textContent = args.map(a => String(a)).join(' ');
        p.style.margin = '5px 0'; p.style.fontSize = '16px';
        c.appendChild(p); return null;
      }});
      env.تعريف('أضف_عنوان', { type: 'دالة_مدمجة', fn: (args) => {
        const c = document.getElementById('مخرجات_الويب');
        const h = document.createElement('h3');
        h.textContent = args.map(a => String(a)).join(' ');
        h.style.margin = '10px 0 5px 0'; h.style.color = '#3498db';
        c.appendChild(h); return null;
      }});
      env.تعريف('غير_اللون', { type: 'دالة_مدمجة', fn: (args) => {
        const color = حل_لون(args[0] || '#f0f0f0');
        document.body.style.backgroundColor = color;
        document.getElementById('مخرجات_الويب').style.backgroundColor = color;
        return null;
      }});
      env.تعريف('غير_لون_النص', { type: 'دالة_مدمجة', fn: (args) => {
        const color = حل_لون(args[0] || '#000');
        document.getElementById('مخرجات_الويب').style.color = color;
        document.getElementById('العنوان_الرئيسي').style.color = color;
        document.getElementById('الوصف').style.color = color;
        document.getElementById('عنوان_النتيجة').style.color = color;
        document.getElementById('عنوان_الويب').style.color = color;
        return null;
      }});
      env.تعريف('امسح_الصفحة', { type: 'دالة_مدمجة', fn: () => {
        const c = document.getElementById('مخرجات_الويب');
        c.innerHTML = ''; c.style.backgroundColor = 'transparent'; c.style.color = 'inherit';
        document.body.style.backgroundColor = '#f0f0f0';
        document.getElementById('العنوان_الرئيسي').style.color = '';
        document.getElementById('الوصف').style.color = '';
        document.getElementById('عنوان_النتيجة').style.color = '';
        document.getElementById('عنوان_الويب').style.color = '';
        return null;
      }});

      evalNode(ast, env);
    }

    function شغل() {
      const code = document.getElementById("كود_عين").value;
      const out = document.getElementById("الناتج");
      const web = document.getElementById("مخرجات_الويب");
      out.innerText = ""; web.innerHTML = "";
      web.style.backgroundColor = 'transparent'; web.style.color = 'inherit';
      document.body.style.backgroundColor = '#f0f0f0';
      document.getElementById('العنوان_الرئيسي').style.color = '';
      document.getElementById('الوصف').style.color = '';
      document.getElementById('عنوان_النتيجة').style.color = '';
      document.getElementById('عنوان_الويب').style.color = '';
      try {
        const tokens = tokenize(code);
        const ast = parse(tokens);
        const env = new البيئة();
        evaluate(ast, env, (msg) => { out.innerText += تحويل_الأرقام_للعربية(msg) + "\n"; });
      } catch (error) { out.innerText = "❌ خطأ: " + error.message; }
    }

    function احفظ() {
      const كود = document.getElementById("كود_عين").value;
      const ملف = new Blob([كود], { type: "text/plain" });
      const ر = document.createElement("a"); ر.href = URL.createObjectURL(ملف); ر.download = "الكود.ain"; ر.click();
    }
    function انسخ() {
      const نص = document.getElementById("الناتج").innerText;
      if (!نص.trim()) { alert("لا يوجد ناتج!"); return; }
      navigator.clipboard.writeText(نص).then(() => alert("تم النسخ!"));
    }
    function امسح_الكود() {
      if (document.getElementById("كود_عين").value.trim() === "") { alert("فارغ!"); return; }
      if (confirm("مسح الكود؟")) document.getElementById("كود_عين").value = "";
    }
    function امسح_الناتج() {
      const out = document.getElementById("الناتج"); const web = document.getElementById("مخرجات_الويب");
      out.innerText = ""; web.innerHTML = "";
      web.style.backgroundColor = 'transparent'; web.style.color = 'inherit';
      document.body.style.backgroundColor = '#f0f0f0';
      document.getElementById('العنوان_الرئيسي').style.color = '';
      document.getElementById('الوصف').style.color = '';
      document.getElementById('عنوان_النتيجة').style.color = '';
      document.getElementById('عنوان_الويب').style.color = '';
    }
  </script>
</body>
</html>
